<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome | JobPortal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;

            background: linear-gradient(
                    135deg,
                    #0F172A 0%,
                    #1E293B 35%,
                    #1E3A8A 70%,
                    #2563EB 100%
            );

            background-size: 300% 300%;
            animation: bgMove 15s ease infinite;
        }

        /* Animated Background */

        @keyframes bgMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating Shapes */

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .03);
            filter: blur(2px);
            animation: float 20s linear infinite;
        }

        .circle:nth-child(1) {
            width: 150px;
            height: 150px;
            left: 10%;
            top: 90%;
            animation-duration: 22s;
        }

        .circle:nth-child(2) {
            width: 90px;
            height: 90px;
            right: 12%;
            top: 95%;
            animation-duration: 18s;
        }

        .circle:nth-child(3) {
            width: 220px;
            height: 220px;
            left: 60%;
            top: 100%;
            animation-duration: 28s;
        }

        .circle:nth-child(4) {
            width: 110px;
            height: 110px;
            left: 40%;
            top: 88%;
            animation-duration: 20s;
        }

        @keyframes float {
            from {
                transform: translateY(0) scale(1);
                opacity: .2;
            }
            to {
                transform: translateY(-120vh) scale(1.4);
                opacity: 0;
            }
        }

        /* Glass Card */

        .card {
            position: relative;
            z-index: 2;

            width: 430px;
            padding: 50px;

            text-align: center;

            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(22px);

            border: 1px solid rgba(255, 255, 255, .10);

            border-radius: 24px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);

            animation: popup 1s ease;
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: translateY(40px) scale(.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */

        .logo {
            width: 95px;
            height: 95px;

            margin: auto;

            border-radius: 50%;

            background: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 36px;
            font-weight: 700;

            color: #2563EB;

            box-shadow: 0 10px 30px rgba(0, 0, 0, .20);

            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            margin-top: 25px;
            color: #fff;
            font-size: 32px;
            font-weight: 700;
        }

        h2 {
            margin-top: 10px;
            color: #CBD5E1;
            font-size: 16px;
            font-weight: 400;
        }

        /* Loader */

        .loader {
            margin: 35px auto 18px;

            width: 60px;
            height: 60px;

            border-radius: 50%;

            border: 5px solid rgba(255, 255, 255, .15);
            border-top: 5px solid #60A5FA;

            animation: spin .9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading {
            color: #F8FAFC;
            font-size: 14px;
            letter-spacing: 3px;

            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% {
                opacity: .45;
            }
        }

        /* Progress Bar */

        .progress {
            margin-top: 28px;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, .08);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress span {
            display: block;
            width: 0%;
            height: 100%;

            background: linear-gradient(
                    90deg,
                    #2563EB,
                    #60A5FA
            );

            animation: load 5s linear forwards;
        }

        @keyframes load {
            to {
                width: 100%;
            }
        }

        .footer {
            margin-top: 28px;
            color: #94A3B8;
            font-size: 13px;
            letter-spacing: .5px;
        }

        /* Responsive */

        @media (max-width: 500px) {

            .card {
                width: 90%;
                padding: 40px 25px;
            }

            .logo {
                width: 80px;
                height: 80px;
                font-size: 30px;
            }

            h1 {
                font-size: 26px;
            }

            h2 {
                font-size: 15px;
            }
        }

    </style>

    <script>
        setTimeout(function () {
            window.location.href = "{% url 'home' %}";
        }, 5000);
    </script>

</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="card">

    <!-- Replace JP with your logo image if available -->
    <div class="logo">
        JP
    </div>

    <h1>Welcome to JobPortal</h1>

    <h2>Your Career Journey Starts Here</h2>

    <div class="loader"></div>

    <div class="loading">
        LOADING...
    </div>

    <div class="progress">
        <span></span>
    </div>

    <div class="footer">
        Preparing your dashboard...
    </div>

</div>

</body>
</html>
